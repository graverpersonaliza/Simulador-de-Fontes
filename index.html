<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simulador de Fontes Gravação Laser</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Roboto&family=Montserrat&family=Oswald&family=Lora&family=Merriweather&family=Open+Sans&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script&family=Great+Vibes&family=Pacifico&family=Lobster&family=Allura&family=Sacramento&family=Satisfy&family=Alex+Brush&family=Courgette&family=Cookie&display=swap" rel="stylesheet">
  <style>
    @font-face { font-family: 'Monotype Corsiva'; src: local('Monotype Corsiva'); }
    @font-face { font-family: 'Cooper Black'; src: local('Cooper Black'); }
    @font-face { font-family: 'Comic Sans MS'; src: local('Comic Sans MS'); }
    @font-face { font-family: 'News701 BT'; src: local('News701 BT'); }
    @font-face { font-family: 'Bodoni Becker'; src: local('Bodoni Becker'); }

    :root {
      --panel-width: 280px;
      --canvas-display-width: 567px; /* ~150 mm at 96 dpi */
      --canvas-display-height: 378px; /* ~100 mm at 96 dpi */
      --base-width: 1000;
      --base-height: 667;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
      background: #fff;
      color: #111;
    }

    .controls {
      width: var(--panel-width);
      height: 100vh;
      background: #f3f3f3;
      padding: 18px;
      overflow-y: auto;
      border-right: 1px solid #ddd;
    }

    .preview {
      flex: 1;
      height: 100vh;
      background: #fff;
      overflow-y: auto;
      overflow-x: auto;
      padding: 18px 18px 18px 8px;
      position: relative;
      display: block;
    }

    h2 {
      margin: 0 0 16px;
      font-size: 1.2rem;
    }

    .group-title {
      margin: 18px 0 10px;
      font-size: 0.9rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .03em;
      color: #333;
    }

    label {
      display: block;
      margin: 0 0 6px;
      font-weight: 700;
      font-size: 0.95rem;
      color: #2563eb;
    }

    label[for="textInput"] { color: #dc2626; }
    label[for="fontSelect"] { color: #7c3aed; }
    label[for="sizeInput"] { color: #ea580c; }
    label[for="angleInput"] { color: #111; }
    label[for="heightInput"] { color: #111; }
    label[for="widthInput"] { color: #111; }
    label[for="outlineInput"] { color: #9333ea; }
    label[for="curveDirection"] { color: #be185d; }
    label[for="curveInput"] { color: #ca8a04; }
    label[for="curveSpreadInput"] { color: #0f766e; }
    label[for="iconUpload"] { color: #b45309; }
    label[for="prebuiltIcons"] { color: #1d4ed8; }

    .hint {
      margin: -2px 0 12px;
      font-size: .88rem;
      color: #111;
      font-weight: 600;
    }

    input, select, button {
      width: 100%;
      margin-bottom: 12px;
      padding: 8px;
      font-size: 1rem;
    }

    input[type="range"] {
      padding: 0;
    }

    .preview canvas {
      display: block;
      width: var(--canvas-display-width);
      height: var(--canvas-display-height);
      max-width: 100%;
      border: 1px solid #ccc;
      background: #fff;
      position: sticky;
      top: 18px;
      touch-action: none;
      image-rendering: auto;
      cursor: grab;
    }

    .preview canvas:active {
      cursor: grabbing;
    }

    .inline-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
    }

    .text-list { display: none; }

    .icon-list > div,
    .text-list > div {
      border: 1px solid #dadada;
      border-radius: 8px;
      background: #fff;
      padding: 8px;
      margin-bottom: 10px;
    }

    .icon-list button,
    .text-list button {
      border: 0;
      color: #fff;
      cursor: pointer;
      margin-top: 4px;
      border-radius: 6px;
      padding: 7px 8px;
    }

    .text-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 8px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .toolbar-4 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
      margin-bottom: 8px;
    }

    .small {
      font-size: 0.86rem;
      color: #2563eb;
      font-weight: 600;
    }

    #realSizeText {
      color: #111;
      font-weight: 700;
    }

    #savePngBtn {
      background: #2563eb;
      color: #fff;
      border: none;
      font-weight: 700;
    }

    #saveSvgBtn {
      background: #16a34a;
      color: #fff;
      border: none;
      font-weight: 700;
    }

    #addTextBtn { background: #2563eb; color: #fff; border: none; font-weight: 700; }
        #deleteTextBtn { background: #e74c3c; color: #fff; border: none; font-weight: 700; }
    #centerTextBtn { background: #ea580c; color: #fff; border: none; font-weight: 700; }

    .selected-layer {
      border-color: #2563eb !important;
      box-shadow: 0 0 0 2px rgba(37,99,235,0.14);
    }

    .canvas-help {
      margin-top: 4px;
      margin-bottom: 12px;
      font-size: .84rem;
      color: #2563eb;
      font-weight: 700;
    }

    @media (max-width: 900px) {
      :root {
        --panel-width: 230px;
        --canvas-display-width: 520px;
        --canvas-display-height: 347px;
      }
      .controls {
        padding: 12px;
      }
      input, select, button {
        font-size: 0.94rem;
        padding: 7px;
      }
      .preview {
        padding: 12px 12px 12px 4px;
      }
    }

  </style>
</head>
<body>
  <div class="controls">
    <h2>Simulador de Fontes Gravação Laser</h2>

    <label for="textInput">Texto</label>
    <input type="text" id="textInput" placeholder="Digite o nome ou frase" />
    <div class="toolbar-4 compact-text-tools">
      <button type="button" id="addTextBtn">Adicionar</button>
      <button type="button" id="centerTextBtn">Centralizar</button>
      <button type="button" id="deleteTextBtn">Excluir</button>
    </div>
    <div class="canvas-help">Digite um nome ou frase e clique em Adicionar. Ou toque/clique numa área vazia do canvas para criar outro texto. Clique no texto para selecionar, mover e editar.</div>


    <label for="fontSelect">Fonte</label>
    <select id="fontSelect">
      <optgroup label="Cursivas">
        <option value="Dancing Script">Dancing Script</option>
        <option value="Great Vibes">Great Vibes</option>
        <option value="Pacifico">Pacifico</option>
        <option value="Lobster">Lobster</option>
        <option value="Allura">Allura</option>
        <option value="Sacramento">Sacramento</option>
        <option value="Satisfy">Satisfy</option>
        <option value="Alex Brush">Alex Brush</option>
        <option value="Courgette">Courgette</option>
        <option value="Cookie">Cookie</option>
      </optgroup>
      <optgroup label="Formais">
        <option value="Monotype Corsiva">Monotype Corsiva</option>
        <option value="Cooper Black">Cooper Black</option>
        <option value="Comic Sans MS">Comic Sans MS</option>
        <option value="Oswald">Oswald</option>
        <option value="Roboto">Roboto</option>
        <option value="Montserrat">Montserrat</option>
        <option value="Playfair Display">Playfair Display</option>
        <option value="Lora">Lora</option>
        <option value="Merriweather">Merriweather</option>
        <option value="Open Sans">Open Sans</option>
      </optgroup>
    </select>

    <p id="realSizeText" class="hint">Altura: 0,0 mm x Largura: 0,0 mm</p>

    <label for="sizeInput">Tamanho do Texto (mm)</label>
    <input type="range" id="sizeInput" min="10" max="150" step="1" value="10" />

    <label for="angleInput">Ângulo (°)</label>
    <input type="range" id="angleInput" min="-180" max="180" step="1" value="0" list="angleTicks" />
    <datalist id="angleTicks">
      <option value="-180"></option>
      <option value="-90"></option>
      <option value="0"></option>
      <option value="90"></option>
      <option value="180"></option>
    </datalist>

    <label for="heightInput">Altura (%)</label>
    <input type="range" id="heightInput" min="0" max="200" step="1" value="100" list="heightTicks" />
    <datalist id="heightTicks">
      <option value="0"></option>
      <option value="50"></option>
      <option value="100"></option>
      <option value="150"></option>
      <option value="200"></option>
    </datalist>

    <label for="widthInput">Largura (%)</label>
    <input type="range" id="widthInput" min="0" max="200" step="1" value="100" list="widthTicks" />
    <datalist id="widthTicks">
      <option value="0"></option>
      <option value="50"></option>
      <option value="100"></option>
      <option value="150"></option>
      <option value="200"></option>
    </datalist>

    <label for="outlineInput">Contorno (mm)</label>
    <input type="range" id="outlineInput" min="0" max="10" step="0.1" value="0" />

    <label for="curveDirection">Curvatura</label>
    <select id="curveDirection">
      <option value="none">Sem curva</option>
      <option value="up">Curvar para cima</option>
      <option value="down">Curvar para baixo</option>
    </select>

    <label for="curveInput">Intensidade da Curva</label>
    <input type="range" id="curveInput" min="0" max="200" value="0" step="1" />

    <label for="curveSpreadInput">Abertura da Curva</label>
    <input type="range" id="curveSpreadInput" min="40" max="220" value="100" step="1" />
    <div class="hint">Menor = mais fechada | Maior = mais aberta</div>

    <div class="text-list" id="textList"></div>

    <div class="group-title">Ícones Pretos</div>

    <label for="iconUpload">Upload de ícones</label>
    <input type="file" id="iconUpload" multiple accept="image/svg+xml,image/png" />

    <label for="prebuiltIcons">Ícones prontos</label>
    <select id="prebuiltIcons">
      <option value="">Escolha um ícone</option>
      <option value="♥">♥ Coração cheio</option>
      <option value="♡">♡ Coração vazado</option>
      <option value="★">★ Estrela</option>
      <option value="●">● Círculo</option>
      <option value="✿">✿ Flor</option>
      <option value="☘︎">☘︎ Folha</option>
    </select>

    <div class="icon-list" id="iconList"></div>

    <div class="group-title">Baixar</div>
    <div class="toolbar">
      <button type="button" id="savePngBtn">Baixar PNG</button>
      <button type="button" id="saveSvgBtn">Baixar SVG</button>
    </div>
  </div>

  <div class="preview">
    <canvas id="designCanvas" width="1000" height="667"></canvas>
  </div>

  <script>
    const DESIGN_WIDTH_MM = 150;
    const DESIGN_HEIGHT_MM = 100;
    const BASE_WIDTH = 1000;
    const BASE_HEIGHT = 667;
    const PX_PER_MM = BASE_WIDTH / DESIGN_WIDTH_MM;
    const MM_PER_PX = DESIGN_WIDTH_MM / BASE_WIDTH;

    const canvas = document.getElementById('designCanvas');
    const ctx = canvas.getContext('2d');
    const iconList = document.getElementById('iconList');
    const textList = document.getElementById('textList');
    let icons = [];
    let texts = [];
    let dragging = null;
    let selectedTextId = null;
    let nextTextId = 1;
    canvas.dataset.textX = String(BASE_WIDTH / 2);
    canvas.dataset.textY = String(BASE_HEIGHT / 2);

    function mmToPx(mm) {
      return mm * PX_PER_MM;
    }

    function pxToMm(px) {
      return px * MM_PER_PX;
    }

    async function loadFont(font, sizePx) {
      try {
        await document.fonts.load(`${sizePx}px "${font}"`);
        await document.fonts.ready;
      } catch (e) {
        console.warn('Fonte não carregada:', font, e);
      }
    }

    function getControlState() {
      return {
        text: document.getElementById('textInput').value || '',
        font: document.getElementById('fontSelect').value,
        sizeMM: parseFloat(document.getElementById('sizeInput').value),
        angleDeg: parseFloat(document.getElementById('angleInput').value),
        heightScale: parseFloat(document.getElementById('heightInput').value) / 100,
        widthScale: parseFloat(document.getElementById('widthInput').value) / 100,
        outlineMM: parseFloat(document.getElementById('outlineInput').value),
        curve: parseFloat(document.getElementById('curveInput').value),
        curveDir: document.getElementById('curveDirection').value,
        curveSpread: parseFloat(document.getElementById('curveSpreadInput').value) / 100
      };
    }

    function getTextState() {
      const selected = getSelectedText();
      const base = getControlState();
      if (selected) {
        return { ...selected };
      }
      return {
        ...base,
        centerX: parseFloat(canvas.dataset.textX),
        centerY: parseFloat(canvas.dataset.textY)
      };
    }

    function buildCurvedGlyphs(text, ctxForMeasure, widthScale, heightScale, curvePx, curveDir, spreadFactor) {
      if (!text) return [];
      const charWidths = [...text].map(char => ctxForMeasure.measureText(char).width * widthScale);
      const totalScaledWidth = charWidths.reduce((a, b) => a + b, 0);
      const span = Math.max(totalScaledWidth * spreadFactor, 1);
      const dir = curveDir === 'up' ? -1 : 1;

      let cursor = 0;
      return [...text].map((char, i) => {
        const charWidth = charWidths[i];
        const centerOriginal = cursor + charWidth / 2;
        cursor += charWidth;
        const u = totalScaledWidth === 0 ? 0 : ((centerOriginal / totalScaledWidth) - 0.5);
        const x = u * span;
        const y = dir * curvePx * (1 - 4 * u * u);
        const slope = dir * (-8 * curvePx * u) / span;
        const rotation = Math.atan(slope);
        return { char, x, y, rotation, width: charWidth };
      });
    }

    function computeTextBounds(state, measureCtx = ctx) {
      const sizePx = mmToPx(state.sizeMM);
      const curvePx = mmToPx(state.curve);
      measureCtx.save();
      measureCtx.font = `${sizePx}px "${state.font}", Arial, sans-serif`;
      let minX = Infinity;
      let minY = Infinity;
      let maxX = -Infinity;
      let maxY = -Infinity;

      if (state.text) {
        if (curvePx > 0 && state.curveDir !== 'none') {
          const glyphs = buildCurvedGlyphs(state.text, measureCtx, state.widthScale, state.heightScale, curvePx, state.curveDir, state.curveSpread);
          glyphs.forEach(g => {
            const m = measureCtx.measureText(g.char);
            const left = (m.actualBoundingBoxLeft || g.width / 2) * state.widthScale;
            const right = (m.actualBoundingBoxRight || g.width / 2) * state.widthScale;
            const ascent = (m.actualBoundingBoxAscent || sizePx * 0.75) * state.heightScale;
            const descent = (m.actualBoundingBoxDescent || sizePx * 0.25) * state.heightScale;
            minX = Math.min(minX, g.x - left);
            maxX = Math.max(maxX, g.x + right);
            minY = Math.min(minY, g.y - ascent);
            maxY = Math.max(maxY, g.y + descent);
          });
        } else {
          const m = measureCtx.measureText(state.text);
          minX = -(m.actualBoundingBoxLeft || (m.width / 2)) * state.widthScale;
          maxX = (m.actualBoundingBoxRight || (m.width / 2)) * state.widthScale;
          minY = -(m.actualBoundingBoxAscent || sizePx * 0.75) * state.heightScale;
          maxY = (m.actualBoundingBoxDescent || sizePx * 0.25) * state.heightScale;
        }
      } else {
        minX = maxX = minY = maxY = 0;
      }

      if (!isFinite(minX)) minX = 0;
      if (!isFinite(minY)) minY = 0;
      if (!isFinite(maxX)) maxX = 0;
      if (!isFinite(maxY)) maxY = 0;

      measureCtx.restore();
      return {
        minX, minY, maxX, maxY,
        widthMm: pxToMm(Math.max(0, maxX - minX)),
        heightMm: pxToMm(Math.max(0, maxY - minY))
      };
    }

    function computeSelectionBounds(state) {
      const off = document.createElement('canvas');
      off.width = BASE_WIDTH;
      off.height = BASE_HEIGHT;
      const offCtx = off.getContext('2d', { willReadFrequently: true });
      offCtx.clearRect(0, 0, off.width, off.height);

      renderText(offCtx, {
        ...state,
        centerX: off.width / 2,
        centerY: off.height / 2,
        angleDeg: 0
      }, false);

      const img = offCtx.getImageData(0, 0, off.width, off.height).data;
      let minX = off.width, minY = off.height, maxX = -1, maxY = -1;

      for (let y = 0; y < off.height; y++) {
        for (let x = 0; x < off.width; x++) {
          const a = img[(y * off.width + x) * 4 + 3];
          if (a > 0) {
            if (x < minX) minX = x;
            if (y < minY) minY = y;
            if (x > maxX) maxX = x;
            if (y > maxY) maxY = y;
          }
        }
      }

      if (maxX === -1 || maxY === -1) {
        return computeTextBounds(state);
      }

      const cx = off.width / 2;
      const cy = off.height / 2;
      return {
        minX: minX - cx,
        minY: minY - cy,
        maxX: maxX - cx,
        maxY: maxY - cy,
        widthMm: pxToMm(Math.max(0, maxX - minX)),
        heightMm: pxToMm(Math.max(0, maxY - minY))
      };
    }

    function renderText(targetCtx, state, isSelected = false) {
      if (!state.text) return;
      const sizePx = mmToPx(state.sizeMM);
      const curvePx = mmToPx(state.curve);
      const outlinePx = mmToPx(state.outlineMM);

      targetCtx.save();
      targetCtx.translate(state.centerX, state.centerY);
      targetCtx.rotate((state.angleDeg * Math.PI) / 180);
      targetCtx.font = `${sizePx}px "${state.font}", Arial, sans-serif`;
      targetCtx.textAlign = 'center';
      targetCtx.textBaseline = 'middle';
      targetCtx.lineWidth = outlinePx;
      targetCtx.strokeStyle = '#000';
      targetCtx.fillStyle = '#000';

      if (curvePx > 0 && state.curveDir !== 'none') {
        const glyphs = buildCurvedGlyphs(state.text, targetCtx, state.widthScale, state.heightScale, curvePx, state.curveDir, state.curveSpread);
        glyphs.forEach(g => {
          targetCtx.save();
          targetCtx.translate(g.x, g.y);
          targetCtx.rotate(g.rotation);
          targetCtx.scale(state.widthScale, state.heightScale);
          if (outlinePx > 0) targetCtx.strokeText(g.char, 0, 0);
          targetCtx.fillText(g.char, 0, 0);
          targetCtx.restore();
        });
      } else {
        targetCtx.save();
        targetCtx.scale(state.widthScale, state.heightScale);
        if (outlinePx > 0) targetCtx.strokeText(state.text, 0, 0);
        targetCtx.fillText(state.text, 0, 0);
        targetCtx.restore();
      }

      targetCtx.restore();

      if (isSelected) {
        const b = computeSelectionBounds(state);
        const x = b.minX;
        const y = b.minY;
        const w = Math.max(1, b.maxX - b.minX);
        const h = Math.max(1, b.maxY - b.minY);

        targetCtx.save();
        targetCtx.translate(state.centerX, state.centerY);
        targetCtx.rotate((state.angleDeg * Math.PI) / 180);
        targetCtx.strokeStyle = '#2563eb';
        targetCtx.lineWidth = 1.2;
        targetCtx.setLineDash([6, 3]);
        targetCtx.strokeRect(x, y, w, h);
        targetCtx.setLineDash([]);
        targetCtx.restore();
      }

    }

    function renderIcons(targetCtx) {
      icons.forEach(icon => {
        targetCtx.save();
        targetCtx.translate(icon.x + icon.size / 2, icon.y + icon.size / 2);
        targetCtx.rotate((icon.angle || 0) * Math.PI / 180);
        if (icon.loaded && icon.img) {
          targetCtx.imageSmoothingEnabled = true;
          targetCtx.imageSmoothingQuality = 'high';
          targetCtx.drawImage(icon.img, -icon.size / 2, -icon.size / 2, icon.size, icon.size);
        } else if (icon.char) {
          targetCtx.font = `${icon.size}px sans-serif`;
          targetCtx.fillStyle = '#000';
          targetCtx.textAlign = 'center';
          targetCtx.textBaseline = 'middle';
          targetCtx.fillText(icon.char, 0, 0);
        }
        targetCtx.restore();
      });
    }

    function renderScene(targetCtx, showSelection = false) {
      targetCtx.imageSmoothingEnabled = true;
      targetCtx.imageSmoothingQuality = 'high';
      targetCtx.clearRect(0, 0, BASE_WIDTH, BASE_HEIGHT);
      texts.forEach(t => renderText(targetCtx, t, showSelection && t.id === selectedTextId));

      const selected = getSelectedText();
      const draft = getControlState();
      const hasDraft = draft.text && !selected;
      if (hasDraft) {
        renderText(targetCtx, {
          ...draft,
          centerX: BASE_WIDTH / 2,
          centerY: BASE_HEIGHT / 2
        }, false);
      }

      renderIcons(targetCtx);
    }

    function getSelectedText() {
      return texts.find(t => t.id === selectedTextId) || null;
    }

    function applyTextToControls(textObj) {
      if (!textObj) return;
      document.getElementById('fontSelect').value = textObj.font;
      document.getElementById('sizeInput').value = textObj.sizeMM;
      document.getElementById('angleInput').value = textObj.angleDeg;
      document.getElementById('heightInput').value = Math.round(textObj.heightScale * 100);
      document.getElementById('widthInput').value = Math.round(textObj.widthScale * 100);
      document.getElementById('outlineInput').value = textObj.outlineMM;
      document.getElementById('curveInput').value = textObj.curve;
      document.getElementById('curveDirection').value = textObj.curveDir;
      document.getElementById('curveSpreadInput').value = Math.round(textObj.curveSpread * 100);
    }

    function createTextFromControls(x = BASE_WIDTH / 2, y = BASE_HEIGHT / 2) {
      const s = getControlState();
      return {
        id: nextTextId++,
        centerX: x,
        centerY: y,
        ...s
      };
    }

    function getNextTextPosition() {
      const draft = createTextFromControls(0, 0);
      const bounds = computeTextBounds(draft);
      const textHeightPx = Math.max(40, mmToPx(bounds.heightMm + 6));
      const textWidthPx = Math.max(120, mmToPx(bounds.widthMm + 12));

      const topY = 80;
      const bottomY = BASE_HEIGHT - 80;
      const stepY = textHeightPx;
      const rowsPerColumn = Math.max(1, Math.floor((bottomY - topY) / stepY) + 1);

      const index = texts.length;
      const column = Math.floor(index / rowsPerColumn);
      const row = index % rowsPerColumn;

      const columnStep = Math.max(160, textWidthPx + 30);
      const columnOffset = column === 0
        ? 0
        : (column % 2 === 1
            ? -Math.ceil(column / 2) * columnStep
            : Math.ceil(column / 2) * columnStep);

      const desiredX = BASE_WIDTH / 2 + columnOffset;
      const marginX = Math.min(BASE_WIDTH / 2 - 30, textWidthPx / 2 + 20);
      const clampedX = Math.max(marginX, Math.min(BASE_WIDTH - marginX, desiredX));

      let desiredY = topY + row * stepY;
      const marginY = Math.min(BASE_HEIGHT / 2 - 30, textHeightPx / 2 + 20);
      desiredY = Math.max(marginY, Math.min(BASE_HEIGHT - marginY, desiredY));

      return {
        x: clampedX,
        y: desiredY
      };
    }

    function selectText(id) {
      selectedTextId = id;
      const selected = getSelectedText();
      applyTextToControls(selected);
      drawCanvas();
    }

    function rebuildTextList() {
      textList.innerHTML = '';
      texts.forEach((t, index) => {
        const wrapper = document.createElement('div');
        if (t.id === selectedTextId) wrapper.classList.add('selected-layer');
        wrapper.innerHTML = `
          <div style="font-weight:700; margin-bottom:6px;">${t.text || `Texto ${index + 1}`}</div>
          <div class="text-actions">
            <button type="button" data-select="${t.id}" style="background:#2563eb;">Selecionar</button>
            <button type="button" data-duplicate="${t.id}" style="background:#7c3aed;">Duplicar</button>
          </div>
          <button type="button" data-delete="${t.id}" style="background:#e74c3c;">Excluir</button>
        `;
        textList.appendChild(wrapper);
      });

      textList.querySelectorAll('button[data-select]').forEach(btn => {
        btn.addEventListener('click', e => {
          selectText(parseInt(e.target.dataset.select, 10));
        });
      });

      textList.querySelectorAll('button[data-duplicate]').forEach(btn => {
        btn.addEventListener('click', e => {
          duplicateText(parseInt(e.target.dataset.duplicate, 10));
        });
      });

      textList.querySelectorAll('button[data-delete]').forEach(btn => {
        btn.addEventListener('click', e => {
          deleteText(parseInt(e.target.dataset.delete, 10));
        });
      });
    }

    function rebuildIconControls() {
      iconList.innerHTML = '';

      icons.forEach((icon, index) => {
        const wrapper = document.createElement('div');
        wrapper.innerHTML = `
          <div style="font-size:18px; margin-bottom:6px;">${icon.char || '🖼️ Ícone'}</div>
          <label style="font-size:0.88rem; margin-bottom:4px; color:#111;">Tamanho</label>
          <input type="range" min="10" max="200" value="${icon.size}" data-index="${index}">
          <label style="font-size:0.88rem; margin-bottom:4px; color:#111;">Rotação</label>
          <input type="range" min="-180" max="180" value="${icon.angle || 0}" data-rotate="${index}">
          <button type="button" data-remove="${index}">Remover</button>
        `;
        iconList.appendChild(wrapper);
      });

      iconList.querySelectorAll('input[data-index]').forEach(slider => {
        slider.addEventListener('input', e => {
          const i = parseInt(e.target.dataset.index, 10);
          icons[i].size = parseInt(e.target.value, 10);
          drawCanvas();
        });
      });

      iconList.querySelectorAll('input[data-rotate]').forEach(rotator => {
        rotator.addEventListener('input', e => {
          const i = parseInt(e.target.dataset.rotate, 10);
          icons[i].angle = parseInt(e.target.value, 10);
          drawCanvas();
        });
      });

      iconList.querySelectorAll('button[data-remove]').forEach(btn => {
        btn.addEventListener('click', e => {
          const i = parseInt(e.target.dataset.remove, 10);
          icons.splice(i, 1);
          drawCanvas();
        });
      });
    }

    async function loadAllFonts() {
      const toLoad = [];
      for (const t of texts) {
        toLoad.push(loadFont(t.font, mmToPx(t.sizeMM)));
      }
      const selected = getSelectedText();
      const controls = getControlState();
      if (!selected && controls.text) {
        toLoad.push(loadFont(controls.font, mmToPx(controls.sizeMM)));
      }
      await Promise.all(toLoad);
    }

    async function drawCanvas() {
      await loadAllFonts();
      renderScene(ctx, true);

      const selected = getSelectedText();
      const draft = getControlState();
      const measureState = selected ? selected : (draft.text ? {
        ...draft,
        centerX: BASE_WIDTH / 2,
        centerY: BASE_HEIGHT / 2
      } : null);
      const bounds = measureState ? computeTextBounds(measureState) : { widthMm: 0, heightMm: 0 };
      document.getElementById('realSizeText').textContent =
        `Altura: ${bounds.heightMm.toFixed(1)} mm x Largura: ${bounds.widthMm.toFixed(1)} mm`;

      rebuildTextList();
      rebuildIconControls();
    }

    function addText(x = null, y = null) {
      const input = document.getElementById('textInput');
      const val = input.value.trim();
      if (!val) return;

      const pos = (x != null && y != null) ? { x, y } : getNextTextPosition();
      const t = createTextFromControls(pos.x, pos.y);
      texts.push(t);

      selectedTextId = t.id;
      applyTextToControls(t);
      input.value = '';
      drawCanvas();
    }

    function duplicateText(id = selectedTextId) {
      const original = texts.find(t => t.id === id);
      if (!original) return;
      const copy = { ...original, id: nextTextId++, centerX: original.centerX + 20, centerY: original.centerY + 20 };
      texts.push(copy);
      selectedTextId = copy.id;
      drawCanvas();
    }

    function deleteText(id = selectedTextId) {
      if (id == null) return;
      texts = texts.filter(t => t.id !== id);
      if (selectedTextId === id) {
        selectedTextId = texts.length ? texts[texts.length - 1].id : null;
        if (selectedTextId) applyTextToControls(getSelectedText());
      }
      drawCanvas();
    }

    function centerSelectedText() {
      const selected = getSelectedText();
      if (!selected) return;
      selected.centerX = BASE_WIDTH / 2;
      selected.centerY = BASE_HEIGHT / 2;
      drawCanvas();
    }

    document.getElementById('addTextBtn').addEventListener('click', addText);
    document.getElementById('deleteTextBtn').addEventListener('click', () => deleteText());
    document.getElementById('centerTextBtn').addEventListener('click', centerSelectedText);

    document.getElementById('textInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        addText();
      }
    });

    function syncControlsToSelected() {
      const selected = getSelectedText();
      if (!selected) return;
      const s = getControlState();
      selected.font = s.font;
      selected.sizeMM = s.sizeMM;
      selected.angleDeg = s.angleDeg;
      selected.heightScale = s.heightScale;
      selected.widthScale = s.widthScale;
      selected.outlineMM = s.outlineMM;
      selected.curve = s.curve;
      selected.curveDir = s.curveDir;
      selected.curveSpread = s.curveSpread;
    }

    document.querySelectorAll('input, select').forEach(el => {
      el.addEventListener('input', () => {
        syncControlsToSelected();
        drawCanvas();
      });
    });

    document.getElementById('fontSelect').addEventListener('change', () => {
      syncControlsToSelected();
      drawCanvas();
    });

    document.getElementById('prebuiltIcons').addEventListener('change', e => {
      if (!e.target.value) return;
      icons.push({
        char: e.target.value,
        x: 100,
        y: 100,
        size: 32,
        angle: 0
      });
      e.target.value = '';
      drawCanvas();
    });

    document.getElementById('iconUpload').addEventListener('change', e => {
      for (const file of e.target.files) {
        const lower = file.name.toLowerCase();
        if (lower.endsWith('.svg')) {
          const reader = new FileReader();
          reader.onload = () => {
            const svgText = reader.result;
            const blob = new Blob([svgText], { type: 'image/svg+xml' });
            const url = URL.createObjectURL(blob);
            const img = new Image();
            img.onload = () => {
              icons.push({
                img,
                loaded: true,
                x: 100,
                y: 100,
                size: 40,
                angle: 0,
                originalSvg: svgText
              });
              drawCanvas();
              URL.revokeObjectURL(url);
            };
            img.src = url;
          };
          reader.readAsText(file);
        } else {
          const img = new Image();
          const url = URL.createObjectURL(file);
          img.onload = () => {
            icons.push({
              img,
              loaded: true,
              x: 100,
              y: 100,
              size: 40,
              angle: 0
            });
            drawCanvas();
            URL.revokeObjectURL(url);
          };
          img.src = url;
        }
      }
    });

    function getCanvasCoords(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = BASE_WIDTH / rect.width;
      const scaleY = BASE_HEIGHT / rect.height;
      return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY
      };
    }

    function getTouchDistance(t1, t2) {
      return Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
    }

    function getTouchMidpoint(t1, t2) {
      return {
        x: (t1.clientX + t2.clientX) / 2,
        y: (t1.clientY + t2.clientY) / 2
      };
    }

    function pickIcon(x, y) {
      for (const icon of icons) {
        const size = icon.size || 32;
        const centerX = icon.x + size / 2;
        const centerY = icon.y + size / 2;
        const radius = size / 1.8;
        if (Math.hypot(x - centerX, y - centerY) <= radius) {
          return icon;
        }
      }
      return null;
    }

    function pickText(x, y) {
      for (let i = texts.length - 1; i >= 0; i--) {
        const t = texts[i];
        const localDx = x - t.centerX;
        const localDy = y - t.centerY;
        const rad = -t.angleDeg * Math.PI / 180;
        const lx = localDx * Math.cos(rad) - localDy * Math.sin(rad);
        const ly = localDx * Math.sin(rad) + localDy * Math.cos(rad);
        const b = computeTextBounds(t);
        if (lx >= b.minX - 8 && lx <= b.maxX + 8 && ly >= b.minY - 8 && ly <= b.maxY + 8) {
          return t;
        }
      }
      return null;
    }

    canvas.addEventListener('mousedown', e => {
      const p = getCanvasCoords(e.clientX, e.clientY);
      const icon = pickIcon(p.x, p.y);
      if (icon) {
        dragging = { type: 'icon', icon, offsetX: p.x - icon.x, offsetY: p.y - icon.y };
        return;
      }

      const text = pickText(p.x, p.y);
      if (text) {
        selectedTextId = text.id;
        const idx = texts.findIndex(t => t.id === text.id);
        if (idx > -1) {
          const selected = texts.splice(idx, 1)[0];
          texts.push(selected);
        }
        applyTextToControls(text);
        dragging = { type: 'text', text, offsetX: p.x - text.centerX, offsetY: p.y - text.centerY };
        drawCanvas();
      } else {
        const draftVal = document.getElementById('textInput').value.trim();
        if (draftVal) {
          addText(p.x, p.y);
        } else {
          selectedTextId = null;
          drawCanvas();
        }
      }
    });

    canvas.addEventListener('mousemove', e => {
      if (!dragging) return;
      const p = getCanvasCoords(e.clientX, e.clientY);
      if (dragging.type === 'icon') {
        dragging.icon.x = p.x - dragging.offsetX;
        dragging.icon.y = p.y - dragging.offsetY;
      } else if (dragging.type === 'text') {
        dragging.text.centerX = p.x - dragging.offsetX;
        dragging.text.centerY = p.y - dragging.offsetY;
      }
      drawCanvas();
    });

    canvas.addEventListener('mouseup', () => {
      dragging = null;
    });

    canvas.addEventListener('mouseleave', () => {
      dragging = null;
    });

    canvas.addEventListener('touchstart', e => {
      if (e.touches.length === 2) {
        const midpoint = getTouchMidpoint(e.touches[0], e.touches[1]);
        const p = getCanvasCoords(midpoint.x, midpoint.y);
        const icon = pickIcon(p.x, p.y);
        if (icon) {
          dragging = {
            type: 'iconPinch',
            icon,
            startDistance: getTouchDistance(e.touches[0], e.touches[1]),
            startSize: icon.size,
            midpointOffsetX: p.x - (icon.x + icon.size / 2),
            midpointOffsetY: p.y - (icon.y + icon.size / 2)
          };
          return;
        }
        const text = pickText(p.x, p.y) || getSelectedText();
        if (text) {
          selectedTextId = text.id;
          applyTextToControls(text);
          dragging = {
            type: 'textPinch',
            text,
            startDistance: getTouchDistance(e.touches[0], e.touches[1]),
            startSizeMM: text.sizeMM,
            midpointOffsetX: p.x - text.centerX,
            midpointOffsetY: p.y - text.centerY
          };
          drawCanvas();
          return;
        }
      }

      const touch = e.touches[0];
      const p = getCanvasCoords(touch.clientX, touch.clientY);
      const icon = pickIcon(p.x, p.y);
      if (icon) {
        dragging = { type: 'icon', icon, offsetX: p.x - icon.x, offsetY: p.y - icon.y };
        return;
      }
      const text = pickText(p.x, p.y);
      if (text) {
        selectedTextId = text.id;
        const idx = texts.findIndex(t => t.id === text.id);
        if (idx > -1) {
          const selected = texts.splice(idx, 1)[0];
          texts.push(selected);
        }
        applyTextToControls(text);
        dragging = { type: 'text', text, offsetX: p.x - text.centerX, offsetY: p.y - text.centerY };
        drawCanvas();
      } else {
        selectedTextId = null;
        drawCanvas();
      }
    }, { passive: true });

    canvas.addEventListener('touchmove', e => {
      if (!dragging) return;

      if (dragging.type === 'iconPinch' && e.touches.length === 2) {
        const distance = getTouchDistance(e.touches[0], e.touches[1]);
        const ratio = distance / Math.max(1, dragging.startDistance);
        dragging.icon.size = Math.max(10, Math.min(200, Math.round(dragging.startSize * ratio)));

        const midpoint = getTouchMidpoint(e.touches[0], e.touches[1]);
        const p = getCanvasCoords(midpoint.x, midpoint.y);
        dragging.icon.x = p.x - dragging.midpointOffsetX - dragging.icon.size / 2;
        dragging.icon.y = p.y - dragging.midpointOffsetY - dragging.icon.size / 2;
        drawCanvas();
        e.preventDefault();
        return;
      }

      if (dragging.type === 'textPinch' && e.touches.length === 2) {
        const distance = getTouchDistance(e.touches[0], e.touches[1]);
        const ratio = distance / Math.max(1, dragging.startDistance);
        dragging.text.sizeMM = Math.max(5, Math.min(150, dragging.startSizeMM * ratio));

        const midpoint = getTouchMidpoint(e.touches[0], e.touches[1]);
        const p = getCanvasCoords(midpoint.x, midpoint.y);
        dragging.text.centerX = p.x - dragging.midpointOffsetX;
        dragging.text.centerY = p.y - dragging.midpointOffsetY;
        applyTextToControls(dragging.text);
        drawCanvas();
        e.preventDefault();
        return;
      }

      const touch = e.touches[0];
      const p = getCanvasCoords(touch.clientX, touch.clientY);
      if (dragging.type === 'icon') {
        dragging.icon.x = p.x - dragging.offsetX;
        dragging.icon.y = p.y - dragging.offsetY;
      } else if (dragging.type === 'text') {
        dragging.text.centerX = p.x - dragging.offsetX;
        dragging.text.centerY = p.y - dragging.offsetY;
      }
      drawCanvas();
      e.preventDefault();
    }, { passive: false });

    canvas.addEventListener('touchend', () => {
      dragging = null;
    });

    async function saveAsPNG() {
      await loadAllFonts();
      const exportScale = 1.2;
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = Math.round(BASE_WIDTH * exportScale);
      tempCanvas.height = Math.round(BASE_HEIGHT * exportScale);
      const tempCtx = tempCanvas.getContext('2d');
      tempCtx.imageSmoothingEnabled = true;
      tempCtx.imageSmoothingQuality = 'high';
      tempCtx.fillStyle = '#ffffff';
      tempCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
      tempCtx.scale(exportScale, exportScale);
      renderScene(tempCtx);
      const link = document.createElement('a');
      link.href = tempCanvas.toDataURL('image/png');
      link.download = 'gravacao_hd.png';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function escapeXml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function buildSingleTextSvg(state) {
      if (!state.text) return '';
      const sizePx = mmToPx(state.sizeMM);
      const outlinePx = mmToPx(state.outlineMM);
      const baseAttrs = `font-family="${escapeXml(state.font)}" font-size="${sizePx}" fill="#000" text-anchor="middle" dominant-baseline="middle"`;
      const strokeAttrs = outlinePx > 0 ? ` stroke="#000" stroke-width="${outlinePx}" paint-order="stroke fill"` : '';
      const rotate = state.angleDeg ? ` rotate(${state.angleDeg})` : '';

      if (state.curve > 0 && state.curveDir !== 'none') {
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = 10; tempCanvas.height = 10;
        const tempCtx = tempCanvas.getContext('2d');
        tempCtx.font = `${sizePx}px "${state.font}", Arial, sans-serif`;
        const glyphs = buildCurvedGlyphs(state.text, tempCtx, state.widthScale, state.heightScale, mmToPx(state.curve), state.curveDir, state.curveSpread);
        return `<g transform="translate(${state.centerX} ${state.centerY})${rotate ? rotate : ''}">` +
          glyphs.map(g => {
            const charRotate = (g.rotation * 180 / Math.PI).toFixed(4);
            return `<text ${baseAttrs}${strokeAttrs} transform="translate(${g.x.toFixed(3)} ${g.y.toFixed(3)}) rotate(${charRotate}) scale(${state.widthScale} ${state.heightScale})">${escapeXml(g.char)}</text>`;
          }).join('') +
          `</g>`;
      }

      return `<text ${baseAttrs}${strokeAttrs} transform="translate(${state.centerX} ${state.centerY})${rotate ? rotate : ''} scale(${state.widthScale} ${state.heightScale})">${escapeXml(state.text)}</text>`;
    }

    function buildTextsSvg() {
      return texts.map(t => buildSingleTextSvg(t)).join('\n');
    }

    function buildIconsSvg() {
      return icons.map(icon => {
        const centerX = icon.x + icon.size / 2;
        const centerY = icon.y + icon.size / 2;
        const rotate = icon.angle ? ` rotate(${icon.angle})` : '';
        if (icon.originalSvg) {
          return `<g transform="translate(${centerX} ${centerY})${rotate} translate(${-icon.size / 2} ${-icon.size / 2}) scale(${icon.size / 100} ${icon.size / 100})">${icon.originalSvg.replace(/<\?xml[\s\S]*?\?>/g, '').replace(/<!DOCTYPE[\s\S]*?>/g, '').replace(/<svg[^>]*>/i, '').replace(/<\/svg>/i, '')}</g>`;
        }
        if (icon.loaded && icon.img) {
          const offscreen = document.createElement('canvas');
          offscreen.width = icon.img.naturalWidth || icon.size;
          offscreen.height = icon.img.naturalHeight || icon.size;
          const offctx = offscreen.getContext('2d');
          offctx.drawImage(icon.img, 0, 0);
          const href = offscreen.toDataURL('image/png');
          return `<image x="${icon.x}" y="${icon.y}" width="${icon.size}" height="${icon.size}" href="${href}" transform="${icon.angle ? `rotate(${icon.angle} ${centerX} ${centerY})` : ''}" />`;
        }
        return `<text x="${centerX}" y="${centerY}" font-family="sans-serif" font-size="${icon.size}" fill="#000" text-anchor="middle" dominant-baseline="middle" transform="${icon.angle ? `rotate(${icon.angle} ${centerX} ${centerY})` : ''}">${escapeXml(icon.char)}</text>`;
      }).join('');
    }

    function saveAsSVG() {
      const svg = `<?xml version="1.0" encoding="UTF-8"?>\n` +
        `<svg xmlns="http://www.w3.org/2000/svg" width="${BASE_WIDTH}" height="${BASE_HEIGHT}" viewBox="0 0 ${BASE_WIDTH} ${BASE_HEIGHT}">\n` +
        `  <rect x="0" y="0" width="${BASE_WIDTH}" height="${BASE_HEIGHT}" fill="#ffffff"/>\n` +
        `  ${buildTextsSvg()}\n` +
        `  ${buildIconsSvg()}\n` +
        `</svg>`;
      const blob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'gravacao.svg';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    document.getElementById('savePngBtn').addEventListener('click', saveAsPNG);
    document.getElementById('saveSvgBtn').addEventListener('click', saveAsSVG);

    drawCanvas();
  </script>
</body>
</html>
